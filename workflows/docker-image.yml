name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blogdb
        ports:
          - 5432:5432
        volumes:
          - postgres_data:/var/lib/postgresql/data

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Build backend
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Build backend Docker image
        working-directory: ./backend
        run: docker build -t blog-backend .

      - name: Build frontend
        working-directory: ./frontend
        run: npm install && npm run build

      - name: Build frontend Docker image
        working-directory: ./frontend
        run: docker build -t blog-frontend .

      - name: Push Docker images
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag blog-backend ${{ secrets.DOCKER_USERNAME }}/blog-backend:latest
          docker tag blog-frontend ${{ secrets.DOCKER_USERNAME }}/blog-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-frontend:latest

volumes:
  postgres_data: